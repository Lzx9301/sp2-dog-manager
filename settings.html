<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>系統設定｜狗狗資源管理</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="top-nav" id="app-nav"></nav>

<div class="page-container">
  <div class="page-header">
    <h1>系統設定</h1>
  </div>

  <div class="card">
    <div class="page-header">
      <h2 style="margin:0;">品種管理</h2>
      <button class="btn btn-primary btn-small" id="add-breed-btn">＋ 新增品種</button>
    </div>
    <div id="breed-list"></div>
  </div>

  <div class="card">
    <div class="page-header">
      <h2 style="margin:0;">特效管理</h2>
      <button class="btn btn-primary btn-small" id="add-effect-btn">＋ 新增特效</button>
    </div>
    <div id="effect-list"></div>
  </div>

  <div class="card">
    <div class="page-header">
      <h2 style="margin:0;">圖案管理</h2>
      <button class="btn btn-primary btn-small" id="add-pattern-btn">＋ 新增圖案</button>
    </div>
    <div id="pattern-list"></div>
  </div>
</div>

<script type="module" src="js/pages/settings.js"></script>
</body>
</html>
