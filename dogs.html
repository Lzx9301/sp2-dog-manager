<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>狗狗管理｜狗狗資源管理</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="top-nav" id="app-nav"></nav>

<div class="page-container">
  <div class="page-header">
    <h1>狗狗管理</h1>
    <div>
      <button class="btn btn-secondary" id="pending-mouth-btn">待補嘴型清單</button>
      <button class="btn btn-primary" id="add-dog-btn">＋ 新增狗狗</button>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="search-input" placeholder="搜尋名稱／系列／來源／備註／紀念標籤" />
  </div>

  <div class="filter-bar">
    <select id="filter-account"><option value="">所有帳號</option></select>
    <select id="filter-breed"><option value="">所有品種</option></select>
    <select id="filter-gender">
      <option value="">所有性別</option>
      <option value="male">公</option>
      <option value="female">母</option>
    </select>
    <select id="filter-dogtype">
      <option value="">純種／混種</option>
      <option value="pure">純種</option>
      <option value="mixed">混種</option>
    </select>
    <select id="filter-series"><option value="">所有系列</option></select>
    <select id="filter-memorial-tag"><option value="">所有紀念標籤</option></select>
  </div>

  <div id="dog-list" class="card-grid"></div>
</div>

<script type="module" src="js/pages/dogs.js"></script>
</body>
</html>
